<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PLEASURE PALACE — a burlesque pinball table</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="cab">
  <canvas id="pcb" width="540" height="1100" tabindex="0"></canvas>
  <div id="side-left"><span>PULL</span></div>
  <div id="side-right"><span>PINUP POWER</span></div>
</div>
<div id="controls-hint">
  <span class="k">Z</span>/<span class="k">X</span> or <span class="k">⇧</span> flippers &nbsp;•&nbsp;
  <span class="k">SPACE</span> plunger &nbsp;•&nbsp;
  <span class="k">←→↑↓</span> nudge &nbsp;•&nbsp;
  <span class="k">M</span> sound
</div>
<script src="js/physics.js"></script>
<script src="js/table.js"></script>
<script src="js/rules.js"></script>
<script src="js/dmd.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
