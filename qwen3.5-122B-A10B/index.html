<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Quest Pinball</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-canvas {
            border: 8px solid #1a1a2e;
            border-radius: 10px;
            box-shadow:
                0 0 20px #0ff,
                inset 0 0 50px rgba(0, 255, 255, 0.1);
        }

        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            color: #0ff;
            font-size: 16px;
            text-shadow: 0 0 10px #0ff;
            z-index: 10;
            pointer-events: none;
        }

        #controls-hint {
            margin-top: 15px;
            color: #888;
            font-size: 12px;
            text-align: center;
        }

        .score-display {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            border: 2px solid #0ff;
        }

        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 3px solid #0ff;
            box-shadow: 0 0 30px #0ff;
            text-align: center;
            color: #0ff;
            display: none;
            z-index: 100;
        }

        #message-overlay h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #0ff;
        }

        #message-overlay p {
            font-size: 14px;
            margin: 10px 0;
            color: #88f;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div class="score-display">SCORE: <span id="score">0</span></div>
            <div class="score-display">BALLS: <span id="balls">3</span></div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="controls-hint">
            Left/Right Arrow: Flippers | Space: Launch Ball | R: Restart
        </div>
        <div id="message-overlay">
            <h1 id="message-title">GAME OVER</h1>
            <p id="message-text"></p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
