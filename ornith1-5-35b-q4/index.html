<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PHOENIX: ASCENSION</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #0a0d13;
      color: #cdd4e0;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    #wrap {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; width: 100vw;
    }
    h1 {
      margin: 8px 0 4px; font-size: 20px; letter-spacing: 2px;
      color: #ff9d2e; text-transform: uppercase;
    }
    /*
      The canvas is sized entirely by main.js / render.js resize(), which fills
      the window while preserving the table's portrait aspect. The JS sets an
      inline width/height, so the stylesheet must NOT impose its own width/height
      (that would fight the JS). We only size the container to fit and let the
      canvas fill it via max-width/max-height: 100%.
    */
    #table {
      display: block;
      max-width: 96vw;
      max-height: 88vh;
      height: auto;
      border: 2px solid #2a2f3a;
      border-radius: 8px;
      background: #141821;
    }
    .help {
      margin: 6px 0 10px; font-size: 12px; color: #7a8497; text-align: center; line-height: 1.5;
    }
    .help b { color: #9aa4b4; }
  </style>
</head>
<body>
  <div id="wrap">
    <h1>Phoenix: Ascension</h1>
    <canvas id="table"></canvas>
    <div class="help">
      <b>&larr; / &rarr;</b> or <b>Z / /</b> — flippers &nbsp;&middot;&nbsp;
      hold <b>SPACE</b> / <b>ENTER</b> and release — launch &nbsp;&middot;&nbsp;
      <b>R</b> — new game
    </div>
  </div>

  <!-- Load order matters: engine first, then table (needs engine), then renderer, then loop.
       ?v= busts the HTTP cache so edits always take effect in the browser. -->
  <script src="js/engine.js?v=3"></script>
  <script src="js/table.js?v=3"></script>
  <script src="js/render.js?v=3"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
