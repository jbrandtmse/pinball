<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Station Pinball - Williams Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .score-display {
            font-size: 24px;
            text-shadow: 0 0 10px #00ff41;
            text-align: center;
            flex: 1;
        }

        .score-label {
            font-size: 12px;
            color: #00aa00;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 32px;
            color: #00ff41;
            letter-spacing: 2px;
        }

        #ballsDisplay {
            flex: 0.5;
            text-align: center;
            border-left: 2px solid #00ff41;
            border-right: 2px solid #00ff41;
            padding: 0 20px;
        }

        #multiballStatus {
            padding: 10px 20px;
            background: rgba(255, 0, 0, 0.3);
            border: 2px solid #ff4444;
            border-radius: 5px;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .hidden {
            display: none !important;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border: 2px solid #00ff41;
            border-radius: 5px;
            color: #00ff41;
            font-family: monospace;
            z-index: 100;
            max-width: 800px;
        }

        .control-item {
            margin: 5px 0;
            font-size: 14px;
        }

        .key {
            background: #00ff41;
            color: #000;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 5px;
        }

        #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 50px;
            border: 3px solid #00ff41;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
            display: none;
            min-width: 400px;
        }

        .game-over-title {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #ff4444;
        }

        .game-over-score {
            font-size: 36px;
            color: #00ff41;
            margin: 20px 0;
        }

        .game-over-label {
            font-size: 18px;
            color: #00aa00;
            margin-bottom: 40px;
        }

        .restart-button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .restart-button:hover {
            background: #00aa00;
            transform: scale(1.05);
        }

        #instructions {
            position: absolute;
            top: 100px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #00ff41;
            border-radius: 5px;
            color: #00ff41;
            font-family: monospace;
            font-size: 12px;
            max-width: 300px;
            z-index: 100;
        }

        .instruction-title {
            font-weight: bold;
            margin-bottom: 10px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="renderCanvas"></canvas>
        <div id="ui">
            <div class="score-display">
                <div class="score-label">PLAYER 1</div>
                <div class="score-value" id="scoreDisplay">0000000</div>
            </div>
            <div id="ballsDisplay">
                <div class="score-label">BALLS</div>
                <div class="score-value" id="ballsLeft">3</div>
            </div>
            <div class="score-display">
                <div class="score-label">HIGH SCORE</div>
                <div class="score-value" id="highScoreDisplay">0000000</div>
            </div>
            <div id="multiballStatus" class="hidden">
                MULTIBALL ACTIVE
            </div>
        </div>

        <div id="instructions">
            <div class="instruction-title">SPACE STATION</div>
            <div>Score by:</div>
            <div>• Hitting targets</div>
            <div>• Completing ramps</div>
            <div>• Bumper hits</div>
            <div>• Multiball = 5x points</div>
        </div>

        <div id="controls">
            <div class="control-item"><span class="key">Z</span> Left Flipper</div>
            <div class="control-item"><span class="key">M</span> Right Flipper</div>
            <div class="control-item"><span class="key">Space</span> Launch Ball</div>
            <div class="control-item"><span class="key">Q</span> Quit Game</div>
        </div>

        <div id="gameOverScreen">
            <div class="game-over-title">GAME OVER</div>
            <div class="game-over-label">FINAL SCORE</div>
            <div class="game-over-score" id="finalScore">0000000</div>
            <div id="newHighScore" style="color: #ff00ff; margin: 20px 0; font-size: 24px; display: none;">
                ★ NEW HIGH SCORE! ★
            </div>
            <button class="restart-button" onclick="location.reload()">PLAY AGAIN</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/babylonjs@6.0.0/babylon.js"></script>
    <script src="game.js"></script>
</body>
</html>
