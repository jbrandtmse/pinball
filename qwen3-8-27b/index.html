<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Force - Pinball</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        #game-container {
            position: relative;
            width: min(66vh, 100vw);
            height: min(100vh, 150vw);
            max-height: 100vh;
            max-width: 100vw;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2%;
            background: linear-gradient(180deg, rgba(0,0,30,0.9), rgba(0,0,20,0.7));
            border-bottom: 2px solid #0af;
            color: #fff;
            z-index: 10;
            font-size: clamp(10px, 1.5vmin, 18px);
        }
        .hud-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .hud-label {
            color: #0af;
            font-size: 0.6em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .hud-value {
            color: #fff;
            font-weight: bold;
            font-size: 1.1em;
            text-shadow: 0 0 10px #0af;
        }
        .hud-highscore .hud-value {
            color: #ff0;
            text-shadow: 0 0 10px #ff0;
        }
        #controls-hint {
            position: absolute;
            bottom: 1%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: clamp(8px, 1.2vmin, 14px);
            z-index: 10;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="hud-section">
                <span class="hud-label">Score</span>
                <span class="hud-value" id="score-display">0</span>
            </div>
            <div class="hud-section">
                <span class="hud-label">Ball</span>
                <span class="hud-value" id="ball-display">1/3</span>
            </div>
            <div class="hud-section">
                <span class="hud-label">Multi-Ball</span>
                <span class="hud-value" id="multiball-display">OFF</span>
            </div>
            <div class="hud-section hud-highscore">
                <span class="hud-label">High Score</span>
                <span class="hud-value" id="highscore-display">0</span>
            </div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="controls-hint">
            ← → or A/L: Flippers &nbsp;|&nbsp; SPACE: Plunger &nbsp;|&nbsp; Enter: Start
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
    <script>
    (function() {
        'use strict';

        const TABLE_W = 800;
        const TABLE_H = 1200;
        const BALL_RADIUS = 12;
        const GRAVITY_Y = 1.0;

        // Playfield bounds
        const PF = {
            left: 70,
            right: 650,
            top: 70,
            bottom: 1130,
            laneLeft: 650,
            laneRight: 730,
            drainCenter: 360,
            drainWidth: 100,
        };
        PF.drainLeft = PF.drainCenter - PF.drainWidth / 2;
        PF.drainRight = PF.drainCenter + PF.drainWidth / 2;

        // Flipper geometry
        const FLIP = {
            leftPivot: { x: 265, y: 900 },
            rightPivot: { x: 455, y: 900 },
            length: 80,
            width: 20,
            restAngle: 0.4,
            activeAngle: -0.55,
            flipSpeed: 0.5,
            returnSpeed: 0.2,
        };

        // Pop bumpers
        const BUMPERS = [
            { x: 250, y: 500, radius: 30 },
            { x: 360, y: 450, radius: 30 },
            { x: 470, y: 500, radius: 30 },
        ];

        // Slingshots
        const SLINGS = [
            { x: 170, y: 700, dir: 1 },
            { x: 550, y: 700, dir: -1 },
        ];

        // Rollovers (top arch)
        const ROLLOVERS = [
            { x: 220, y: 160 },
            { x: 360, y: 140 },
            { x: 500, y: 160 },
        ];

        // Drop targets
        const TARGETS = [
            { x: 170, y: 340 },
            { x: 240, y: 320 },
            { x: 360, y: 310 },
            { x: 480, y: 320 },
            { x: 550, y: 340 },
        ];

        // Center lane targets
        const CENTER_TARGETS = [
            { x: 320, y: 620 },
            { x: 360, y: 600 },
            { x: 400, y: 620 },
        ];

        // ============================================================
        // GAME STATE
        // ============================================================
        const game = {
            state: 'attract',
            score: 0,
            highScore: parseInt(localStorage.getItem('starforce_hs') || '0'),
            balls: 3,
            currentBall: 1,
            ballsInPlay: 0,
            ballSaveActive: false,
            ballSaveTimer: 0,
            multiBall: false,
            rolloverLit: [false, false, false],
            targetsDown: [false, false, false, false, false],
            centerTargetsDown: [false, false, false],
            plungerCharging: false,
            plungerPower: 0,
            drainTimer: 0,
            attractTimer: 0,
            flipperSoundCd: 0,
            timer: 0,
            starBonus: 0,
        };

        // ============================================================
        // PHYSICS
        // ============================================================
        const { Engine, World, Bodies, Body, Constraint, Events, Composite, Vector } = Matter;

        const engine = Engine.create();
        engine.gravity.y = GRAVITY_Y;
        engine.positionIterations = 8;
        engine.velocityIterations = 6;
        const world = engine.world;

        let balls = [];
        let flipperLeft, flipperRight;
        let flipperLeftAngle = FLIP.restAngle;
        let flipperRightAngle = -FLIP.restAngle;

        // Visual effects
        const fx = {
            bumperFlash: [0, 0, 0],
            slingFlash: [0, 0],
            rolloverFlash: [0, 0, 0],
            targetFlash: [0, 0, 0, 0, 0],
            centerTargetFlash: [0, 0, 0],
            plungerVisual: 0,
            particles: [],
            trails: [],
            popups: [],
            stars: Array.from({ length: 150 }, () => ({
                x: Math.random() * TABLE_W,
                y: Math.random() * TABLE_H,
                s: Math.random() * 1.8 + 0.5,
                b: Math.random() * 0.6 + 0.4,
                t: Math.random() * Math.PI * 2,
            })),
        };

        // ============================================================
        // INPUT
        // ============================================================
        const keys = {};
        document.addEventListener('keydown', e => {
            if (e.code === 'Space') e.preventDefault();
            if (e.repeat) return;
            keys[e.code] = true;
            if (e.code === 'Enter' && (game.state === 'attract' || game.state === 'gameOver')) {
                startGame();
            }
            if (e.code === 'Space' && game.state === 'playing' && !game.plungerCharging) {
                if (balls.some(b => b.position.x > PF.laneLeft && b.position.y > PF.bottom - 120)) {
                    game.plungerCharging = true;
                    game.plungerPower = 0;
                }
            }
        });
        document.addEventListener('keyup', e => {
            keys[e.code] = false;
            if (e.code === 'Space' && game.plungerCharging) {
                firePlunger();
                game.plungerCharging = false;
            }
        });

        // ============================================================
        // AUDIO
        // ============================================================
        let actx = null;
        function audio() {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === 'suspended') actx.resume();
            return actx;
        }
        function beep(freq, dur, type, vol, slideTo) {
            try {
                const c = audio();
                const o = c.createOscillator();
                const g = c.createGain();
                o.connect(g); g.connect(c.destination);
                const t = c.currentTime;
                o.type = type || 'sine';
                o.frequency.setValueAtTime(freq, t);
                if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
                g.gain.setValueAtTime(vol || 0.2, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                o.start(t); o.stop(t + dur);
            } catch(e) {}
        }
        function sfx(name) {
            switch(name) {
                case 'bumper': beep(180, 0.12, 'sine', 0.25, 60); break;
                case 'sling': beep(500, 0.06, 'square', 0.12, 200); break;
                case 'rollover': beep(700, 0.15, 'sine', 0.2, 900); break;
                case 'flipper': beep(120, 0.04, 'triangle', 0.08); break;
                case 'plunger': beep(60, 0.12, 'sawtooth', 0.2, 200); break;
                case 'target': beep(400, 0.12, 'triangle', 0.18, 500); break;
                case 'drain': beep(150, 0.4, 'sine', 0.2, 40); break;
                case 'multiball':
                    [300,500,700].forEach((f,i) => setTimeout(() => beep(f, 0.3, 'sine', 0.15), i*120));
                    break;
                case 'start':
                    [200,350,500,700].forEach((f,i) => setTimeout(() => beep(f, 0.2, 'sine', 0.12), i*100));
                    break;
                case 'gameover':
                    [400,350,300,250,200].forEach((f,i) => setTimeout(() => beep(f, 0.25, 'sawtooth', 0.1), i*180));
                    break;
                case 'bonus': beep(800, 0.2, 'sine', 0.2, 1200); break;
            }
        }

        // ============================================================
        // PHYSICS HELPERS
        // ============================================================
        function wall(x1, y1, x2, y2, opts) {
            const o = Object.assign({ restitution: 0.2, friction: 0.05, label: 'wall' }, opts);
            const thick = o.thick || 20;   // thick physics walls prevent tunneling (visual stays a thin line)
            delete o.thick;
            const cx = (x1+x2)/2, cy = (y1+y2)/2;
            const len = Math.hypot(x2-x1, y2-y1) + thick;  // extend so corners overlap cleanly
            const ang = Math.atan2(y2-y1, x2-x1);
            const b = Bodies.rectangle(cx, cy, len, thick, Object.assign({ isStatic: true, restitution: 0.2, friction: 0.05, label: 'wall' }, o));
            World.add(world, b);
            return b;
        }

        function circleBody(x, y, r, opts) {
            const b = Bodies.circle(x, y, r, Object.assign({ isStatic: true, restitution: 0.5, friction: 0 }, opts));
            World.add(world, b);
            return b;
        }

        // ============================================================
        // BUILD PLAYFIELD
        // ============================================================
        function buildPlayfield() {
            World.clear(world, false, true);
            balls = [];
            fx.bumperFlash = [0,0,0];
            fx.slingFlash = [0,0];
            fx.rolloverFlash = [0,0,0];
            fx.targetFlash = [0,0,0,0,0];
            fx.centerTargetFlash = [0,0,0];

            // === OUTER WALLS ===
            // Left wall
            wall(PF.left, PF.top, PF.left, PF.bottom);
            // Bottom left section
            wall(PF.left, PF.bottom, PF.drainLeft, PF.bottom);
            // Bottom right section
            wall(PF.drainRight, PF.bottom, PF.right, PF.bottom);
            // Right wall (below top gap)
            wall(PF.right, PF.top + 80, PF.right, PF.bottom);
            // Top left
            wall(PF.left, PF.top, 200, PF.top);
            // Top right
            wall(520, PF.top, PF.right, PF.top);
            // Top cap (backglass): closes the open span between the arches so
            // no ball can ever fly off the top of the table.
            wall(200, PF.top, 520, PF.top);

            // === LAUNCH LANE ===
            // Lane left wall
            wall(PF.laneLeft, PF.top + 80, PF.laneLeft, PF.bottom);
            // Lane right wall
            wall(PF.laneRight, PF.laneTop || PF.top, PF.laneRight, PF.bottom);
            // Lane bottom
            wall(PF.laneLeft, PF.bottom, PF.laneRight, PF.bottom);
            // Lane top connection (small section)
            wall(PF.right, PF.top, PF.laneRight, PF.top);

            // Cap the top of the launch lane so the ball can't fly off the table.
            wall(PF.laneLeft, PF.top, PF.laneRight, PF.top);

            // Launch funnel: a steep deflector at the top of the lane. A rising
            // ball that enters the top of the lane is pushed left (by the assist
            // in update) and deflected up-left into the playfield.
            const funnel = wall(PF.laneLeft + 10, PF.top + 52, PF.laneRight, PF.top + 24);
            funnel.label = 'funnel';
            funnel.restitution = 0.7;
            funnel.friction = 0.05;

            // === TOP ARCH (curved guides) ===
            wall(200, PF.top, 240, PF.top + 50);
            wall(520, PF.top, 480, PF.top + 50);
            // Center divider
            wall(360, PF.top, 360, PF.top + 70);

            // === ROLLOVER LANE GUIDES ===
            wall(160, 130, 280, 130);
            wall(280, 130, 280, 230);
            wall(440, 130, 560, 130);
            wall(440, 130, 440, 230);
            // Side guides below rollovers
            wall(180, 230, 220, 300);
            wall(500, 230, 540, 300);
            // Center lane guides
            wall(300, 230, 300, 580);
            wall(420, 230, 420, 580);

            // === MIDDLE SECTION ===
            // Guide from center to slingshots
            wall(300, 580, 240, 660);
            wall(420, 580, 480, 660);

            // === SLINGSHOT GUIDES ===
            // Left sling guide
            wall(130, 660, 200, 750, { restitution: 0.4, label: 'slingWallL' });
            wall(130, 660, 130, 780);
            // Right sling guide
            wall(590, 660, 520, 750, { restitution: 0.4, label: 'slingWallR' });
            wall(590, 660, 590, 780);

            // === INLANE / OUTLANE GUIDES ===
            // Inlane walls
            wall(240, 780, 240, 880);
            wall(480, 780, 480, 880);
            // Outlane inner walls
            wall(140, 780, 140, 920);
            wall(580, 780, 580, 920);
            // Outlane outer (connect to flippers area)
            wall(140, 920, 180, 960);
            wall(580, 920, 540, 960);

            // === BELOW FLIPPERS - DRAIN CHANNEL ===
            wall(180, 960, PF.drainLeft, 1060);
            wall(540, 960, PF.drainRight, 1060);
            // Drain channel
            wall(PF.drainLeft, 1060, PF.drainLeft, PF.bottom);
            wall(PF.drainRight, 1060, PF.drainRight, PF.bottom);
            // Guide from drain right to launch lane
            wall(PF.drainRight, 1060, PF.laneLeft, 1020);

            // === BUMPERS (physics circles) ===
            BUMPERS.forEach((b, i) => {
                circleBody(b.x, b.y, b.radius, { restitution: 1.2, label: `bumper_${i}` });
            });

            // === SLINGSHOTS (triangle physics) ===
            SLINGS.forEach((s, i) => {
                const tri = Bodies.polygon(s.x, s.y, 3, 30, {
                    isStatic: true, angle: i === 0 ? Math.PI/2 : -Math.PI/2,
                    restitution: 1.0, friction: 0, label: `sling_${i}`
                });
                World.add(world, tri);
            });

            // === DROP TARGETS ===
            TARGETS.forEach((t, i) => {
                const tg = Bodies.rectangle(t.x, t.y, 10, 45, {
                    isStatic: true, restitution: 0.3, friction: 0.1, label: `target_${i}`
                });
                World.add(world, tg);
            });

            // === CENTER LANE TARGETS ===
            CENTER_TARGETS.forEach((t, i) => {
                const ct = Bodies.rectangle(t.x, t.y, 10, 35, {
                    isStatic: true, restitution: 0.3, friction: 0.1, label: `ctr_${i}`
                });
                World.add(world, ct);
            });

            // === FLIPPERS (dynamic, constrained at pivot) ===
            // Left flipper
            flipperLeft = Bodies.rectangle(
                FLIP.leftPivot.x + FLIP.length/2 * Math.cos(FLIP.restAngle),
                FLIP.leftPivot.y + FLIP.length/2 * Math.sin(FLIP.restAngle),
                FLIP.length, FLIP.width, {
                    isStatic: false,
                    density: 0.01,
                    restitution: 0.4,
                    friction: 0.3,
                    frictionAir: 0.05,
                    label: 'flipL'
                }
            );
            const lc = Constraint.create({
                pointA: FLIP.leftPivot,
                bodyB: flipperLeft,
                pointB: { x: -FLIP.length/2, y: 0 },
                length: 0, stiffness: 1
            });
            Body.setAngle(flipperLeft, FLIP.restAngle);
            World.add(world, [flipperLeft, lc]);

            // Right flipper
            flipperRight = Bodies.rectangle(
                FLIP.rightPivot.x - FLIP.length/2 * Math.cos(FLIP.restAngle),
                FLIP.rightPivot.y + FLIP.length/2 * Math.sin(FLIP.restAngle),
                FLIP.length, FLIP.width, {
                    isStatic: false,
                    density: 0.01,
                    restitution: 0.4,
                    friction: 0.3,
                    frictionAir: 0.05,
                    label: 'flipR'
                }
            );
            const rc = Constraint.create({
                pointA: FLIP.rightPivot,
                bodyB: flipperRight,
                pointB: { x: FLIP.length/2, y: 0 },
                length: 0, stiffness: 1
            });
            Body.setAngle(flipperRight, -FLIP.restAngle);
            World.add(world, [flipperRight, rc]);
        }

        // ============================================================
        // BALL MANAGEMENT
        // ============================================================
        function createBall(x, y) {
            const b = Bodies.circle(x, y, BALL_RADIUS, {
                restitution: 0.55,
                friction: 0.02,
                frictionAir: 0.001,
                density: 0.003,
                label: 'ball'
            });
            World.add(world, b);
            balls.push(b);
            return b;
        }

        function removeBall(ball) {
            const i = balls.indexOf(ball);
            if (i !== -1) balls.splice(i, 1);
            World.remove(world, ball);
        }

        function spawnInPlunger() {
            createBall((PF.laneLeft + PF.laneRight) / 2, PF.bottom - 55);
            game.ballsInPlay = 1;
            game.ballSaveActive = true;
            game.ballSaveTimer = 12000;
            sfx('start');
        }

        function drainBall(ball) {
            removeBall(ball);
            game.ballsInPlay = Math.max(0, game.ballsInPlay - 1);
            sfx('drain');
            addPopup(ball.position.x, PF.bottom - 40, 'DRAIN', '#f44');

            if (game.ballsInPlay === 0) {
                if (game.multiBall) { game.multiBall = false; }
                game.drainTimer = 2000;
                game.state = 'ballLost';
            }
        }

        // ============================================================
        // SCORING
        // ============================================================
        function addScore(pts) {
            game.score += pts;
            if (game.score > game.highScore) {
                game.highScore = game.score;
                localStorage.setItem('starforce_hs', String(game.highScore));
            }
        }

        function addPopup(x, y, text, color) {
            fx.popups.push({ x, y, text, color, life: 1.5, maxLife: 1.5 });
        }

        function spawnParticles(x, y, n, color, spd) {
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2;
                const v = (0.5 + Math.random() * 0.5) * spd;
                fx.particles.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 1, maxLife: 0.4+Math.random()*0.4, color, size: 2+Math.random()*3 });
            }
        }

        // ============================================================
        // PLUNGER
        // ============================================================
        function firePlunger() {
            const pwr = 10 + game.plungerPower * 24;
            const ball = balls.find(b => b.position.x > PF.laneLeft - 10 && b.position.y > PF.bottom - 130);
            if (ball) {
                // Up-and-slightly-left so the launch funnel picks it up into the playfield
                Body.setVelocity(ball, { x: -6, y: -pwr });
                sfx('plunger');
            }
            game.plungerPower = 0;
        }

        // ============================================================
        // FLIPPER UPDATE (kinematic - set angle directly)
        // ============================================================
        function updateFlippers(dt) {
            const lKey = keys['ArrowLeft'] || keys['KeyA'];
            const rKey = keys['ArrowRight'] || keys['KeyL'] || keys['KeyK'];

            // Left flipper
            if (lKey) {
                flipperLeftAngle = Math.max(FLIP.activeAngle, flipperLeftAngle - FLIP.flipSpeed * dt * 10);
                if (flipperLeftAngle < FLIP.restAngle - 0.01) {
                    if (game.flipperSoundCd <= 0) { sfx('flipper'); game.flipperSoundCd = 100; }
                }
            } else {
                flipperLeftAngle = Math.min(FLIP.restAngle, flipperLeftAngle + FLIP.returnSpeed * dt * 10);
            }
            // Apply to physics body
            Body.setAngle(flipperLeft, flipperLeftAngle);
            Body.setAngularVelocity(flipperLeft, 0);

            // Right flipper
            if (rKey) {
                flipperRightAngle = Math.min(-FLIP.activeAngle, flipperRightAngle + FLIP.flipSpeed * dt * 10);
                if (flipperRightAngle > -FLIP.restAngle + 0.01) {
                    if (game.flipperSoundCd <= 0) { sfx('flipper'); game.flipperSoundCd = 100; }
                }
            } else {
                flipperRightAngle = Math.max(-FLIP.restAngle, flipperRightAngle - FLIP.returnSpeed * dt * 10);
            }
            Body.setAngle(flipperRight, flipperRightAngle);
            Body.setAngularVelocity(flipperRight, 0);

            game.flipperSoundCd -= dt * 1000;
        }

        // ============================================================
        // COLLISIONS
        // ============================================================
        let lastBumperHit = [0, 0, 0];
        let lastSlingHit = [0, 0];
        let lastTargetHit = [0, 0, 0, 0, 0];
        let lastCtHit = [0, 0, 0];

        Events.on(engine, 'collisionStart', (e) => {
            const now = Date.now();
            for (const pair of e.pairs) {
                const a = pair.bodyA, b = pair.bodyB;
                const aBall = a.label === 'ball', bBall = b.label === 'ball';
                if (!aBall && !bBall) continue;
                const ball = aBall ? a : b;
                const other = aBall ? b : a;
                const lbl = other.label || '';
                const spd = Math.hypot(ball.velocity.x, ball.velocity.y);

                // Bumpers
                if (lbl.startsWith('bumper_')) {
                    const i = parseInt(lbl.split('_')[1]);
                    if (now - lastBumperHit[i] > 150) {
                        lastBumperHit[i] = now;
                        const bp = BUMPERS[i];
                        const dx = ball.position.x - bp.x, dy = ball.position.y - bp.y;
                        const d = Math.hypot(dx, dy) || 1;
                        Body.applyForce(ball, ball.position, { x: (dx/d)*0.08, y: (dy/d)*0.08 });
                        fx.bumperFlash[i] = 1;
                        addScore(1000);
                        addPopup(ball.position.x, ball.position.y - 20, '+1000', '#0ff');
                        spawnParticles(ball.position.x, ball.position.y, 6, '#0ff', 4);
                        sfx('bumper');
                    }
                }

                // Slingshots
                if (lbl.startsWith('sling_')) {
                    const i = parseInt(lbl.split('_')[1]);
                    if (now - lastSlingHit[i] > 200) {
                        lastSlingHit[i] = now;
                        const s = SLINGS[i];
                        const dir = s.dir;
                        Body.applyForce(ball, ball.position, { x: dir * 0.06, y: -0.04 });
                        fx.slingFlash[i] = 1;
                        addScore(75);
                        sfx('sling');
                    }
                }

                // Drop targets
                if (lbl.startsWith('target_')) {
                    const i = parseInt(lbl.split('_')[1]);
                    if (!game.targetsDown[i] && now - lastTargetHit[i] > 300) {
                        lastTargetHit[i] = now;
                        game.targetsDown[i] = true;
                        fx.targetFlash[i] = 1;
                        addScore(2000);
                        addPopup(TARGETS[i].x, TARGETS[i].y - 30, '+2000', '#f0f');
                        spawnParticles(TARGETS[i].x, TARGETS[i].y, 10, '#ff0', 3);
                        sfx('target');
                        if (game.targetsDown.every(d => d)) {
                            addScore(50000);
                            addPopup(TABLE_W/2, 350, 'ALL TARGETS! +50000', '#ff0');
                            spawnParticles(TABLE_W/2, 350, 25, '#f0f', 6);
                            sfx('bonus');
                            setTimeout(() => { game.targetsDown = [false,false,false,false,false]; }, 2000);
                        }
                    }
                }

                // Center lane targets
                if (lbl.startsWith('ctr_')) {
                    const i = parseInt(lbl.split('_')[1]);
                    if (!game.centerTargetsDown[i] && now - lastCtHit[i] > 300) {
                        lastCtHit[i] = now;
                        game.centerTargetsDown[i] = true;
                        fx.centerTargetFlash[i] = 1;
                        addScore(5000);
                        addPopup(CENTER_TARGETS[i].x, CENTER_TARGETS[i].y - 20, '+5000', '#0f8');
                        spawnParticles(CENTER_TARGETS[i].x, CENTER_TARGETS[i].y, 8, '#0f8', 3);
                        sfx('target');
                        if (game.centerTargetsDown.every(d => d)) {
                            addScore(100000);
                            addPopup(TABLE_W/2, 620, 'CENTER! +100000', '#0f8');
                            spawnParticles(TABLE_W/2, 620, 20, '#0f8', 5);
                            sfx('bonus');
                            setTimeout(() => { game.centerTargetsDown = [false,false,false]; }, 2000);
                        }
                    }
                }
            }
        });

        // ============================================================
        // ROLLOVER / MULTI-BALL
        // ============================================================
        let lastRollover = [0, 0, 0];
        function checkZones() {
            const now = Date.now();
            ROLLOVERS.forEach((r, i) => {
                if (game.rolloverLit[i]) return;
                for (const ball of balls) {
                    const d = Math.hypot(ball.position.x - r.x, ball.position.y - r.y);
                    if (d < 35 && now - lastRollover[i] > 500) {
                        lastRollover[i] = now;
                        game.rolloverLit[i] = true;
                        fx.rolloverFlash[i] = 1;
                        addScore(10000);
                        addPopup(r.x, r.y - 20, '+10000', '#0f0');
                        spawnParticles(r.x, r.y, 8, '#0f0', 3);
                        sfx('rollover');
                        if (game.rolloverLit.every(l => l)) {
                            activateMultiBall();
                            game.rolloverLit = [false, false, false];
                        }
                        break;
                    }
                }
            });
        }

        function activateMultiBall() {
            game.multiBall = true;
            addScore(200000);
            addPopup(TABLE_W/2, 250, 'MULTI-BALL! +200000', '#f0f');
            sfx('multiball');
            spawnParticles(TABLE_W/2, 300, 30, '#f0f', 8);
            setTimeout(() => { if (game.state === 'playing') { createBall(300, 100); game.ballsInPlay++; } }, 400);
            setTimeout(() => { if (game.state === 'playing') { createBall(420, 100); game.ballsInPlay++; } }, 800);
        }

        // ============================================================
        // GAME STATE
        // ============================================================
        function startGame() {
            game.state = 'playing';
            game.score = 0;
            game.currentBall = 1;
            game.ballsInPlay = 0;
            game.multiBall = false;
            game.rolloverLit = [false,false,false];
            game.targetsDown = [false,false,false,false,false];
            game.centerTargetsDown = [false,false,false];
            game.plungerCharging = false;
            game.plungerPower = 0;
            game.ballSaveActive = false;
            game.starBonus = 0;
            // Remove all balls
            balls.forEach(b => World.remove(world, b));
            balls = [];
            flipperLeftAngle = FLIP.restAngle;
            flipperRightAngle = -FLIP.restAngle;
            spawnInPlunger();
        }

        function nextBall() {
            game.currentBall++;
            if (game.currentBall > game.balls) {
                game.state = 'gameOver';
                sfx('gameover');
            } else {
                game.state = 'playing';
                game.ballsInPlay = 0;
                game.rolloverLit = [false,false,false];
                game.targetsDown = [false,false,false,false,false];
                game.centerTargetsDown = [false,false,false];
                spawnInPlunger();
            }
        }

        // ============================================================
        // UPDATE
        // ============================================================
        let lastTs = 0;
        function update(dt) {
            const ms = dt * 1000;

            if (game.state === 'playing') {
                updateFlippers(dt);

                if (game.plungerCharging) {
                    game.plungerPower = Math.min(1, game.plungerPower + dt * 2);
                }

                if (game.ballSaveActive) {
                    game.ballSaveTimer -= ms;
                    if (game.ballSaveTimer <= 0) game.ballSaveActive = false;
                }

                checkZones();

                // Gentle leftward "airflow" drift in the launch lane so the
                // funnel reliably catches a rising ball and funnels it into the
                // playfield (mimics the upward air jet on real machines).
                for (const b of balls) {
                    if (b.position.x > PF.laneLeft && b.position.y < PF.top + 160) {
                        Body.applyForce(b, b.position, { x: -0.0009, y: 0 });
                    }
                }
            }

            // Drain check
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                if (b.position.y > PF.bottom + 60) {
                    if (game.state === 'playing' || game.state === 'attract') {
                        if (game.ballSaveActive && game.state === 'playing') {
                            addScore(5000);
                            addPopup(PF.laneLeft + 40, PF.bottom - 80, 'BALL SAVE!', '#0f8');
                            removeBall(b);
                            game.ballsInPlay = Math.max(0, game.ballsInPlay);
                            spawnInPlunger();
                        } else {
                            drainBall(b);
                        }
                    }
                }
            }

            // Ball lost -> next ball
            if (game.state === 'ballLost') {
                game.drainTimer -= ms;
                if (game.drainTimer <= 0) nextBall();
            }

            // Attract mode: spawn demo balls
            if (game.state === 'attract') {
                game.attractTimer += ms;
                if (balls.length === 0 && game.attractTimer > 2000) {
                    createBall(360, 100);
                    game.ballsInPlay = 1;
                    game.attractTimer = 0;
                }
            }

            // FX updates
            fx.bumperFlash = fx.bumperFlash.map(f => Math.max(0, f - dt * 5));
            fx.slingFlash = fx.slingFlash.map(f => Math.max(0, f - dt * 5));
            fx.rolloverFlash = fx.rolloverFlash.map(f => Math.max(0, f - dt * 3));
            fx.targetFlash = fx.targetFlash.map(f => Math.max(0, f - dt * 4));
            fx.centerTargetFlash = fx.centerTargetFlash.map(f => Math.max(0, f - dt * 4));
            fx.plungerVisual = game.plungerCharging ? game.plungerPower : 0;

            for (let i = fx.particles.length - 1; i >= 0; i--) {
                const p = fx.particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= dt;
                if (p.life <= 0) fx.particles.splice(i, 1);
            }
            for (let i = fx.popups.length - 1; i >= 0; i--) {
                const p = fx.popups[i];
                p.life -= dt; p.y -= 25 * dt;
                if (p.life <= 0) fx.popups.splice(i, 1);
            }

            // Ball trails
            if (balls.length > 0) {
                const lb = balls[balls.length - 1];
                fx.trails.push({ x: lb.position.x, y: lb.position.y, life: 1 });
                if (fx.trails.length > 10) fx.trails.shift();
            }
            fx.trails.forEach(t => t.life -= dt * 3);
            fx.trails = fx.trails.filter(t => t.life > 0);
        }

        // ============================================================
        // RENDER
        // ============================================================
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = TABLE_W;
        canvas.height = TABLE_H;

        function render() {
            const t = Date.now() * 0.001;
            ctx.save();

            // Background
            const bg = ctx.createLinearGradient(0, 0, 0, TABLE_H);
            bg.addColorStop(0, '#030310');
            bg.addColorStop(0.5, '#080820');
            bg.addColorStop(1, '#030310');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, TABLE_W, TABLE_H);

            // Stars
            fx.stars.forEach(s => {
                const tw = 0.4 + 0.6 * Math.sin(t * 1.5 + s.t);
                ctx.fillStyle = `rgba(180,200,255,${s.b * tw})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.s, 0, Math.PI*2);
                ctx.fill();
            });

            // Playfield
            const pfGrad = ctx.createLinearGradient(PF.left, PF.top, PF.right, PF.bottom);
            pfGrad.addColorStop(0, '#0a1528');
            pfGrad.addColorStop(0.5, '#0c1830');
            pfGrad.addColorStop(1, '#081020');
            ctx.fillStyle = pfGrad;
            ctx.fillRect(PF.left, PF.top, PF.right - PF.left, PF.bottom - PF.top);

            // Playfield border glow
            ctx.shadowColor = '#0af';
            ctx.shadowBlur = 12;
            ctx.strokeStyle = 'rgba(0,170,255,0.4)';
            ctx.lineWidth = 3;
            ctx.strokeRect(PF.left, PF.top, PF.right - PF.left, PF.bottom - PF.top);
            ctx.shadowBlur = 0;

            // Launch lane
            ctx.fillStyle = '#060c18';
            ctx.fillRect(PF.laneLeft, PF.top, PF.laneRight - PF.laneLeft, PF.bottom - PF.top);
            ctx.strokeStyle = 'rgba(0,170,255,0.25)';
            ctx.lineWidth = 2;
            ctx.strokeRect(PF.laneLeft, PF.top, PF.laneRight - PF.laneLeft, PF.bottom - PF.top);

            // Wall rendering
            ctx.strokeStyle = 'rgba(0,180,255,0.35)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            // Main walls
            ctx.beginPath();
            ctx.moveTo(PF.left, PF.top); ctx.lineTo(PF.left, PF.bottom);
            ctx.moveTo(PF.left, PF.bottom); ctx.lineTo(PF.drainLeft, PF.bottom);
            ctx.moveTo(PF.drainRight, PF.bottom); ctx.lineTo(PF.right, PF.bottom);
            ctx.moveTo(PF.right, PF.top + 80); ctx.lineTo(PF.right, PF.bottom);
            ctx.moveTo(PF.left, PF.top); ctx.lineTo(200, PF.top);
            ctx.moveTo(520, PF.top); ctx.lineTo(PF.right, PF.top);
            // Arch
            ctx.moveTo(200, PF.top); ctx.lineTo(240, PF.top + 50);
            ctx.moveTo(520, PF.top); ctx.lineTo(480, PF.top + 50);
            ctx.moveTo(360, PF.top); ctx.lineTo(360, PF.top + 70);
            // Rollover guides
            ctx.moveTo(160, 130); ctx.lineTo(280, 130);
            ctx.moveTo(280, 130); ctx.lineTo(280, 230);
            ctx.moveTo(440, 130); ctx.lineTo(560, 130);
            ctx.moveTo(440, 130); ctx.lineTo(440, 230);
            // Center lanes
            ctx.moveTo(300, 230); ctx.lineTo(300, 580);
            ctx.moveTo(420, 230); ctx.lineTo(420, 580);
            ctx.moveTo(300, 580); ctx.lineTo(240, 660);
            ctx.moveTo(420, 580); ctx.lineTo(480, 660);
            // Sling guides
            ctx.moveTo(130, 660); ctx.lineTo(200, 750);
            ctx.moveTo(130, 660); ctx.lineTo(130, 780);
            ctx.moveTo(590, 660); ctx.lineTo(520, 750);
            ctx.moveTo(590, 660); ctx.lineTo(590, 780);
            // Inlane/outlane
            ctx.moveTo(240, 780); ctx.lineTo(240, 880);
            ctx.moveTo(480, 780); ctx.lineTo(480, 880);
            ctx.moveTo(140, 780); ctx.lineTo(140, 920);
            ctx.moveTo(580, 780); ctx.lineTo(580, 920);
            ctx.moveTo(140, 920); ctx.lineTo(180, 960);
            ctx.moveTo(580, 920); ctx.lineTo(540, 960);
            // Below flippers
            ctx.moveTo(180, 960); ctx.lineTo(PF.drainLeft, 1060);
            ctx.moveTo(540, 960); ctx.lineTo(PF.drainRight, 1060);
            ctx.moveTo(PF.drainLeft, 1060); ctx.lineTo(PF.drainLeft, PF.bottom);
            ctx.moveTo(PF.drainRight, 1060); ctx.lineTo(PF.drainRight, PF.bottom);
            ctx.moveTo(PF.drainRight, 1060); ctx.lineTo(PF.laneLeft, 1020);
            // Launch lane walls
            ctx.moveTo(PF.laneLeft, PF.top + 80); ctx.lineTo(PF.laneLeft, PF.bottom);
            ctx.moveTo(PF.laneRight, PF.top); ctx.lineTo(PF.laneRight, PF.bottom);
            ctx.stroke();

            // Drain zone
            ctx.fillStyle = 'rgba(255,0,0,0.08)';
            ctx.fillRect(PF.drainLeft, PF.bottom - 15, PF.drainRight - PF.drainLeft, 15);

            // === BUMPERS ===
            BUMPERS.forEach((b, i) => {
                const f = fx.bumperFlash[i];
                // Outer ring
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius + 5, 0, Math.PI*2);
                ctx.fillStyle = '#1a2535';
                ctx.fill();
                ctx.strokeStyle = f > 0.2 ? `rgba(0,255,255,${f})` : 'rgba(0,150,200,0.4)';
                ctx.lineWidth = 3;
                ctx.stroke();
                // Main
                const bg2 = ctx.createRadialGradient(b.x-5, b.y-5, 3, b.x, b.y, b.radius);
                bg2.addColorStop(0, f > 0.5 ? '#fff' : '#0cf');
                bg2.addColorStop(0.6, f > 0.3 ? '#6ef' : '#057');
                bg2.addColorStop(1, '#023');
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
                ctx.fillStyle = bg2;
                ctx.fill();
                // Center
                ctx.beginPath();
                ctx.arc(b.x, b.y, 7, 0, Math.PI*2);
                ctx.fillStyle = f > 0.3 ? '#fff' : '#0af';
                ctx.fill();
                if (f > 0.1) {
                    ctx.shadowColor = '#0ff';
                    ctx.shadowBlur = 18 * f;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(0,255,255,${f*0.5})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            });

            // === SLINGSHOTS ===
            SLINGS.forEach((s, i) => {
                const f = fx.slingFlash[i];
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(i === 0 ? Math.PI/2 : -Math.PI/2);
                ctx.beginPath();
                ctx.moveTo(0, -32);
                ctx.lineTo(28, 22);
                ctx.lineTo(-28, 22);
                ctx.closePath();
                const sg = ctx.createLinearGradient(0, -32, 0, 22);
                sg.addColorStop(0, f > 0.5 ? '#fff' : `rgba(255,${80+f*120},0,1)`);
                sg.addColorStop(1, f > 0.2 ? '#f80' : '#840');
                ctx.fillStyle = sg;
                ctx.fill();
                ctx.strokeStyle = f > 0.1 ? `rgba(255,200,0,${f})` : 'rgba(255,100,0,0.5)';
                ctx.lineWidth = 3;
                ctx.stroke();
                if (f > 0.1) { ctx.shadowColor = '#f80'; ctx.shadowBlur = 12*f; ctx.stroke(); ctx.shadowBlur = 0; }
                ctx.restore();
            });

            // === ROLLOVERS ===
            ROLLOVERS.forEach((r, i) => {
                const lit = game.rolloverLit[i];
                const pulse = fx.rolloverFlash[i];
                ctx.beginPath();
                ctx.arc(r.x, r.y, 16, 0, Math.PI*2);
                if (lit) {
                    const rg = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, 16);
                    rg.addColorStop(0, '#fff');
                    rg.addColorStop(0.5, '#0f0');
                    rg.addColorStop(1, 'rgba(0,255,0,0.2)');
                    ctx.fillStyle = rg;
                    ctx.shadowColor = '#0f0';
                    ctx.shadowBlur = 15;
                } else {
                    ctx.fillStyle = `rgba(0,100,0,${0.4+pulse*0.6})`;
                    ctx.shadowBlur = 0;
                }
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = lit ? '#0f0' : 'rgba(0,150,0,0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // === DROP TARGETS ===
            TARGETS.forEach((tg, i) => {
                const down = game.targetsDown[i];
                const f = fx.targetFlash[i];
                ctx.save();
                ctx.translate(tg.x, tg.y);
                if (!down) {
                    ctx.fillStyle = f > 0.3 ? '#fff' : '#e33';
                    ctx.shadowColor = '#f33';
                    ctx.shadowBlur = f > 0 ? 12 : 4;
                    ctx.fillRect(-5, -22, 10, 44);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#f88';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(-5, -22, 10, 44);
                } else {
                    ctx.fillStyle = 'rgba(120,30,30,0.4)';
                    ctx.fillRect(-22, -3, 44, 6);
                }
                ctx.restore();
            });

            // === CENTER TARGETS ===
            CENTER_TARGETS.forEach((ct, i) => {
                const down = game.centerTargetsDown[i];
                const f = fx.centerTargetFlash[i];
                ctx.save();
                ctx.translate(ct.x, ct.y);
                if (!down) {
                    ctx.fillStyle = f > 0.3 ? '#fff' : '#0c8';
                    ctx.shadowColor = '#0c8';
                    ctx.shadowBlur = f > 0 ? 10 : 3;
                    ctx.fillRect(-5, -17, 10, 34);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#8fc';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(-5, -17, 10, 34);
                } else {
                    ctx.fillStyle = 'rgba(0,100,80,0.4)';
                    ctx.fillRect(-18, -3, 36, 6);
                }
                ctx.restore();
            });

            // === FLIPPERS ===
            function drawFlipper(body, pivot, dir) {
                ctx.save();
                ctx.translate(pivot.x, pivot.y);
                ctx.rotate(body.angle);
                ctx.scale(dir, 1);
                const fw = FLIP.length, fh = FLIP.width;
                const fg = ctx.createLinearGradient(0, -fh/2, 0, fh/2);
                fg.addColorStop(0, '#e8e8e8');
                fg.addColorStop(0.3, '#999');
                fg.addColorStop(0.7, '#555');
                fg.addColorStop(1, '#333');
                ctx.fillStyle = fg;
                ctx.beginPath();
                ctx.moveTo(0, -fh/2);
                ctx.lineTo(fw, -fh/3);
                ctx.arc(fw, 0, fh/3, -Math.PI/2, Math.PI/2);
                ctx.lineTo(0, fh/2);
                ctx.arc(0, 0, fh/2, Math.PI/2, -Math.PI/2);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,170,255,0.6)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                // Pivot
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI*2);
                ctx.fillStyle = '#0af';
                ctx.fill();
                ctx.restore();
            }
            if (flipperLeft) drawFlipper(flipperLeft, FLIP.leftPivot, 1);
            if (flipperRight) drawFlipper(flipperRight, FLIP.rightPivot, -1);

            // === PLUNGER ===
            const plX = (PF.laneLeft + PF.laneRight) / 2;
            const plY = PF.bottom - 15 - fx.plungerVisual * 25;
            ctx.fillStyle = '#555';
            ctx.fillRect(plX - 18, plY, 36, 8);
            ctx.fillStyle = '#0af';
            ctx.fillRect(plX - 22, plY - 2, 44, 3);
            // Spring
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const sy = plY + 8 + i * 5 + fx.plungerVisual * 25;
                ctx.moveTo(plX - 8, sy);
                ctx.lineTo(plX + 8, sy + 2);
            }
            ctx.stroke();
            // Power bar
            if (game.plungerCharging) {
                const bh = game.plungerPower * 80;
                ctx.fillStyle = '#0af';
                ctx.fillRect(PF.laneRight + 8, PF.bottom - bh, 6, bh);
                ctx.strokeStyle = 'rgba(0,255,255,0.5)';
                ctx.strokeRect(PF.laneRight + 8, PF.bottom - 80, 6, 80);
            }

            // === BALL TRAILS ===
            fx.trails.forEach(tr => {
                ctx.beginPath();
                ctx.arc(tr.x, tr.y, BALL_RADIUS * tr.life * 0.4, 0, Math.PI*2);
                ctx.fillStyle = `rgba(100,200,255,${tr.life * 0.25})`;
                ctx.fill();
            });

            // === BALLS ===
            balls.forEach(b => {
                const { x, y } = b.position;
                ctx.shadowColor = '#aaf';
                ctx.shadowBlur = 10;
                const bgr = ctx.createRadialGradient(x-3, y-3, 2, x, y, BALL_RADIUS);
                bgr.addColorStop(0, '#fff');
                bgr.addColorStop(0.3, '#bcd');
                bgr.addColorStop(0.7, '#568');
                bgr.addColorStop(1, '#234');
                ctx.beginPath();
                ctx.arc(x, y, BALL_RADIUS, 0, Math.PI*2);
                ctx.fillStyle = bgr;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(x-3, y-3, 3.5, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fill();
            });

            // === PARTICLES ===
            fx.particles.forEach(p => {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (p.life/p.maxLife), 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // === SCORE POPUPS ===
            fx.popups.forEach(p => {
                ctx.globalAlpha = Math.min(1, p.life / p.maxLife * 2);
                ctx.fillStyle = p.color;
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.fillText(p.text, p.x, p.y);
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            // === HUD OVERLAYS ===
            if (game.ballSaveActive && game.state === 'playing') {
                ctx.fillStyle = 'rgba(0,255,100,0.7)';
                ctx.font = 'bold 13px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`BALL SAVE ${Math.ceil(game.ballSaveTimer/1000)}s`, TABLE_W/2, TABLE_H - 25);
            }
            if (game.multiBall && game.state === 'playing') {
                ctx.fillStyle = 'rgba(255,0,255,0.7)';
                ctx.font = 'bold 15px monospace';
                ctx.textAlign = 'center';
                ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 6);
                ctx.fillText(`MULTI-BALL x${balls.length}`, TABLE_W/2, TABLE_H - 50);
                ctx.globalAlpha = 1;
            }

            // Attract mode
            if (game.state === 'attract') {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, TABLE_H*0.3, TABLE_W, TABLE_H*0.4);
                ctx.fillStyle = '#0af';
                ctx.font = 'bold 52px monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#0af';
                ctx.shadowBlur = 25;
                ctx.fillText('STAR FORCE', TABLE_W/2, TABLE_H*0.44);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '22px monospace';
                ctx.fillText('Press ENTER to Play', TABLE_W/2, TABLE_H*0.54);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '14px monospace';
                ctx.fillText('\u2190 \u2192 Flippers  |  SPACE Plunger', TABLE_W/2, TABLE_H*0.61);
                if (game.highScore > 0) {
                    ctx.fillStyle = '#ff0';
                    ctx.font = '16px monospace';
                    ctx.fillText(`HIGH SCORE: ${game.highScore.toLocaleString()}`, TABLE_W/2, TABLE_H*0.66);
                }
            }

            // Game over
            if (game.state === 'gameOver') {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, TABLE_H*0.3, TABLE_W, TABLE_H*0.4);
                ctx.fillStyle = '#f44';
                ctx.font = 'bold 44px monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#f00';
                ctx.shadowBlur = 20;
                ctx.fillText('GAME OVER', TABLE_W/2, TABLE_H*0.42);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '22px monospace';
                ctx.fillText(`Score: ${game.score.toLocaleString()}`, TABLE_W/2, TABLE_H*0.52);
                if (game.score >= game.highScore && game.score > 0) {
                    ctx.fillStyle = '#ff0';
                    ctx.font = 'bold 18px monospace';
                    ctx.fillText('\u2605 NEW HIGH SCORE! \u2605', TABLE_W/2, TABLE_H*0.58);
                }
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '15px monospace';
                ctx.fillText('Press ENTER to Play Again', TABLE_W/2, TABLE_H*0.64);
            }

            // Ball lost
            if (game.state === 'ballLost') {
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(0, TABLE_H*0.42, TABLE_W, TABLE_H*0.16);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 30px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`BALL ${game.currentBall} of ${game.balls}`, TABLE_W/2, TABLE_H*0.5);
            }

            ctx.restore();
        }

        // ============================================================
        // MAIN LOOP
        // ============================================================
        function loop(ts) {
            const dt = Math.min((ts - lastTs) / 1000, 0.034);
            lastTs = ts;

            Engine.update(engine, dt * 1000);
            update(dt);
            render();

            // Update DOM HUD
            document.getElementById('score-display').textContent = game.score.toLocaleString();
            document.getElementById('ball-display').textContent = game.state === 'playing' ? `${game.currentBall}/${game.balls}` : '--';
            document.getElementById('multiball-display').textContent = game.multiBall ? `ON x${balls.length}` : 'OFF';
            document.getElementById('highscore-display').textContent = game.highScore.toLocaleString();

            requestAnimationFrame(loop);
        }

        // ============================================================
        // INIT
        // ============================================================
        buildPlayfield();

        // Attract mode ball
        createBall((PF.laneLeft + PF.laneRight) / 2, PF.bottom - 55);
        game.ballsInPlay = 1;

        lastTs = performance.now();
        requestAnimationFrame(loop);

        // TEMP DEBUG HOOK (for automated launch test)
        window.__dbg = {
            start: startGame,
            fire: firePlunger,
            get balls() { return balls; },
            get state() { return game.state; },
            get score() { return game.score; },
            get charge() { return game.plungerPower; },
        };
    })();
    </script>
</body>
</html>
